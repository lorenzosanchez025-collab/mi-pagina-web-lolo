<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Turnos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }
    .card {
      border: 1px solid #ccc;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .hidden {
      display: none;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      margin-top: 5px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
    .button-secondary {
      background-color: #6c757d;
      margin-top: 10px;
    }
    .button-secondary:hover {
      background-color: #5a6268;
    }
  </style>
</head>
<body>

  <!-- Formulario de Registro de Usuario -->
  <div id="register-card" class="card">
    <h2>Registro de Usuario</h2>
    <form id="register-form">
      <div class="form-group">
        <label for="reg-name">Nombre Completo:</label>
        <input type="text" id="reg-name" required placeholder="Ej. Juan Pérez">
      </div>
      <div class="form-group">
        <label for="reg-email">Correo Electrónico:</label>
        <input type="email" id="reg-email" required placeholder="ejemplo@mail.com">
      </div>
      <button type="submit">Registrarse</button>
    </form>
  </div>

  <!-- Formulario de Reserva de Turno -->
  <div id="appointment-card" class="card hidden">
    <h2>Sacar Turno</h2>
    <p>Bienvenido/a, <strong id="user-display-name"></strong></p>
    <form id="appointment-form">
      <div class="form-group">
        <label for="app-service">Servicio:</label>
        <select id="app-service" required>
          <option value="">Seleccione un servicio</option>
          <option value="Consulta General">Consulta General</option>
          <option value="Mantenimiento">Mantenimiento</option>
        </select>
      </div>
      <div class="form-group">
        <label for="app-date">Fecha:</label>
        <input type="date" id="app-date" required>
      </div>
      <div class="form-group">
        <label for="app-time">Hora:</label>
        <input type="time" id="app-time" required>
      </div>
      <button type="submit">Confirmar Turno</button>
    </form>
  </div>

  <!-- Resumen del Turno Confirmado -->
  <div id="summary-card" class="card hidden">
    <h2>Turno Confirmado</h2>
    <p><strong>Cliente:</strong> <span id="summary-name"></span></p>
    <p><strong>Servicio:</strong> <span id="summary-service"></span></p>
    <p><strong>Fecha:</strong> <span id="summary-date"></span></p>
    <p><strong>Hora:</strong> <span id="summary-time"></span></p>
    <button id="cancel-booking-button" class="button-secondary">Cancelar / Volver</button>
  </div>

  <!-- Código JavaScript encerrado adecuadamente -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Estado de la aplicación
      let currentUser = null;

      // Elementos del DOM
      const registerCard = document.getElementById("register-card");
      const registerForm = document.getElementById("register-form");
      const appointmentCard = document.getElementById("appointment-card");
      const appointmentForm = document.getElementById("appointment-form");
      const summaryCard = document.getElementById("summary-card");
      const userDisplayName = document.getElementById("user-display-name");

      // 1. Manejo del Registro de Usuario
      registerForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const name = document.getElementById("reg-name").value;
        const email = document.getElementById("reg-email").value;

        if (name && email) {
          currentUser = { name, email };
          userDisplayName.textContent = name;
          registerCard.classList.add("hidden");
          appointmentCard.classList.remove("hidden");
        }
      });

      // 2. Manejo de Reserva de Turno
      appointmentForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const service = document.getElementById("app-service").value;
        const date = document.getElementById("app-date").value;
        const time = document.getElementById("app-time").value;

        if (service && date && time) {
          document.getElementById("summary-name").textContent = currentUser.name;
          document.getElementById("summary-service").textContent = service;
          document.getElementById("summary-date").textContent = date;
          document.getElementById("summary-time").textContent = time;

          appointmentCard.classList.add("hidden");
          summaryCard.classList.remove("hidden");
        }
      });

      // 3. Manejo de Cancelación/Volver (Instrucción corregida y completada)
      document.getElementById("cancel-booking-button").addEventListener("click", () => {
        summaryCard.classList.add("hidden");
        appointmentCard.classList.remove("hidden");
      });
    });
  </script>
</body>
</html>
